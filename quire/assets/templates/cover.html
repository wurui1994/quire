<section id="{{cover_id}}" class="cover">
  <div class="cover-field" aria-hidden="true">{{geometry}}</div>

  <div class="cover-frame">
    <header class="cover-top">
      <span class="cover-series">{{series}}丛书</span>
      <span class="cover-tag">{{vol_tag}}</span>
    </header>

    <div class="cover-mid">
      <span class="cover-glyph" aria-hidden="true">{{vol_glyph}}</span>
      <h1 class="cover-title">{{title}}</h1>
      <div class="cover-rule"><span class="cover-rule-line"></span><span class="cover-rule-mark"></span><span class="cover-rule-line"></span></div>
      <p class="cover-subtitle">{{subtitle}}</p>
    </div>

    <footer class="cover-bottom">
      {{layer_indicator}}
      <div class="cover-byline">
        <span class="cover-author">{{author}}</span>
        <span class="cover-sep">·</span>
        <span class="cover-date">{{pub_date}}</span>
      </div>
    </footer>
  </div>
</section>
