<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="{{author}}">
<title>{{title}} — {{series}}丛书</title>
<style>{{css}}</style>
{{extra_css}}
</head>
<body class="{{body_cls}}">

<!-- 顶部工具栏 -->
<div class="toolbar">
  <span class="brand">{{brand}}</span>
  <span class="tools">
    <button id="btn-toc" title="目录">☰</button>
    <button id="btn-indent" title="首行缩进">⏎</button>
    <button id="btn-dark" title="暗色模式">◐</button>
    <button id="btn-follow" type="button" title="目录自动跟随" aria-pressed="false">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="4.3" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M8 1.5V4.4 M8 11.6V14.5 M1.5 8H4.4 M11.6 8H14.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
  </span>
</div>

<!-- 阅读进度条 -->
<div class="progress-bar"></div>

<!-- 侧边 TOC -->
<nav class="sidebar">
  <div class="sidebar-head">
    <h3>目 录</h3>
    <button id="btn-collapse-all" type="button" title="全部展开 / 收起" aria-label="收起全部">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 11l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <ul>{{toc}}</ul>
</nav>

<!-- 正文 -->
<div class="main">
{{body}}
</div>

<script>{{js}}</script>
</body>
</html>
